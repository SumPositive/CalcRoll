      <rect x="300"  y="250" width="118" height="20" rx="10" fill="#9dd6b4"/>
      <rect x="596"  y="250" width="128" height="20" rx="10" fill="#eaa6b0"/>
      <!-- 行3 y=304 -->
      <rect x="300"  y="304" width="176" height="20" rx="10" fill="#b3a6de"/>
      <rect x="540"  y="304" width="184" height="20" rx="10" fill="#f4dd8f"/>
    </g>
    <!-- 合計ライン(強調) -->
    <rect x="300" y="360" width="424" height="14" rx="7" fill="#f0a98f" opacity="0.85"/>
  </g>
</svg>

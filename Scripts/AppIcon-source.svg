<?xml version="1.0" encoding="UTF-8"?>
<!--
  Calclin / カルメモ App Icon source (2026-07-13 / 五角柱+横向き円筒(ロール)+電卓キーパッド)
  コンセプト: シャープな五角柱の口に太い円筒(ロール紙)が半分埋まる。ロールにはカラフルな計算行を印字。
  五角柱の正面に電卓キーパッド3×3(発色パステル9色)を配置。角丸は無し(全パスの角は直角)。
  背景=深めの小豆色グラデ。1024x1024。iOSが角丸マスク。

  ★ 側面キーパッドについて:
    左右の側面には正面と同じキーパッドを「透視ワープ(台形)」で貼るが、SVG の transform は
    アフィン止まりで台形にできない。このため側面キーパッドは SVG には描かず、
    Scripts/build_icon.py が正面キーパッドを PNG 化 -> 透視ワープ -> 合成して仕上げる。

  書き出し: python3 Scripts/build_icon.py  (= AppIcon-base-1024.png を生成)
            ※ rsvg-convert 単体だと側面キーパッドが付かないので build_icon.py を使うこと
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景: 小豆色を深く鮮やかに。上→下でコントラストを強める -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#bd5f57"/><stop offset="0.5" stop-color="#9c4842"/><stop offset="1" stop-color="#6f2e2c"/>
    </linearGradient>
    <!-- 天面: 象牙色の最明部。上を純白寄りにしてコントラストを稼ぐ -->
    <linearGradient id="topg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#f3e4c9"/>
    </linearGradient>
    <!-- 円筒の曲面: 上縁(y110)=陰 → 見かけ中心(y470付近)=ハイライト → 下方は埋没。
         明暗差を広げて丸みを強調。 -->
    <linearGradient id="cyl" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="500">
      <stop offset="0"    stop-color="#c6a578"/>
      <stop offset="0.14" stop-color="#e8d3b1"/>
      <stop offset="0.32" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="0.90" stop-color="#f7ecd7"/>
      <stop offset="1"    stop-color="#e6d5b8"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#2e1212" flood-opacity="0.40"/>
    </filter>
    <filter id="dsc" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2e1212" flood-opacity="0.34"/>
    </filter>
    <!-- 側面パネル形状のクリップ(投影キーパッドが面からはみ出さないように) -->
    <clipPath id="clipLeft">
      <path d="M 235.7 536.2 L 205.8 520.1 L 95.0 460.8 L 65.0 444.7 L 65.0 478.7 L 65.0 770.7 L 65.0 804.7 L 95.0 820.8 L 205.8 880.1 L 235.7 896.2 Z"/>
    </clipPath>
    <clipPath id="clipRight">
      <path d="M 959.0 478.7 L 959.0 444.7 L 929.0 460.8 L 818.2 520.1 L 788.3 536.2 L 788.3 896.2 L 818.2 880.1 L 929.0 820.8 L 959.0 804.7 L 959.0 770.7 Z"/>
    </clipPath>
    <!-- 円柱の見える範囲: 口ラインより少し上で切り、円柱を奥へ引っ込める。天面の口が僅かに覗く。 -->
    <clipPath id="clipRoll">
      <path d="M 0 0 L 1024 0 L 1024 488.0 L 812.0 488.0 L 788.3 502.0 L 754.3 502.0 L 269.7 502.0 L 235.7 502.0 L 212.0 488.0 L 0 488.0 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#ds)">
    <path d="M 478.3 392.5 L 512.0 388.2 L 545.7 392.5 L 925.3 440.5 L 959.0 444.7 L 959.0 478.7 L 959.0 770.7 L 959.0 804.7 L 929.0 820.8 L 818.2 880.1 L 788.3 896.2 L 754.3 896.2 L 269.7 896.2 L 235.7 896.2 L 205.8 880.1 L 95.0 820.8 L 65.0 804.7 L 65.0 770.7 L 65.0 478.7 L 65.0 444.7 L 98.7 440.5 Z" fill="#e8d2b2"/>
  </g>
  <path d="M 235.7 536.2 L 205.8 520.1 L 95.0 460.8 L 65.0 444.7 L 65.0 478.7 L 65.0 770.7 L 65.0 804.7 L 95.0 820.8 L 205.8 880.1 L 235.7 896.2 Z" fill="#e8d2b2"/>
  <path d="M 959.0 478.7 L 959.0 444.7 L 929.0 460.8 L 818.2 520.1 L 788.3 536.2 L 788.3 896.2 L 818.2 880.1 L 929.0 820.8 L 959.0 804.7 L 959.0 770.7 Z" fill="#e3cca9"/>
  <path d="M 788.3 536.2 L 235.7 536.2 L 235.7 896.2 L 788.3 896.2 Z" fill="#faf3e6"/>
  <!-- 正面の稜線: 角丸を廃し、境界は薄い線で表現。左=光、右=陰 -->
  <line x1="235.7" y1="536.2" x2="235.7" y2="896.2" stroke="#ffffff" stroke-width="3" opacity="0.22"/>
  <line x1="788.3" y1="536.2" x2="788.3" y2="896.2" stroke="#7a5a3a" stroke-width="3" opacity="0.16"/>
  <line x1="235.7" y1="536.2" x2="788.3" y2="536.2" stroke="#7a5a3a" stroke-width="3" opacity="0.14"/>
  <!-- 電卓キーパッド 3×3。発色を上げたパステル9色・配置を散らす。左右側面へは同じパッドをアフィン投影(<use>)。 -->
  <g id="keypad">
    <!-- row1: スカイ / ピーチ / ミント -->
    <rect x="296.5" y="568.6" width="125.3" height="85.2" rx="16" fill="#9fcbe8"/>
    <rect x="296.5" y="568.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="296.5" y="647.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="449.4" y="568.6" width="125.3" height="85.2" rx="16" fill="#f2b894"/>
    <rect x="449.4" y="568.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="449.4" y="647.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="602.3" y="568.6" width="125.3" height="85.2" rx="16" fill="#9dd6b4"/>
    <rect x="602.3" y="568.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="602.3" y="647.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <!-- row2: クリーム / ローズ / ラベンダー -->
    <rect x="296.5" y="673.6" width="125.3" height="85.2" rx="16" fill="#f4dd8f"/>
    <rect x="296.5" y="673.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="296.5" y="752.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="449.4" y="673.6" width="125.3" height="85.2" rx="16" fill="#eaa6b0"/>
    <rect x="449.4" y="673.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="449.4" y="752.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="602.3" y="673.6" width="125.3" height="85.2" rx="16" fill="#b3a6de"/>
    <rect x="602.3" y="673.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="602.3" y="752.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <!-- row3: ライラック / アクア / コーラル -->
    <rect x="296.5" y="778.6" width="125.3" height="85.2" rx="16" fill="#d0a8d4"/>
    <rect x="296.5" y="778.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="296.5" y="857.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="449.4" y="778.6" width="125.3" height="85.2" rx="16" fill="#8fd4c9"/>
    <rect x="449.4" y="778.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="449.4" y="857.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
    <rect x="602.3" y="778.6" width="125.3" height="85.2" rx="16" fill="#f0a98f"/>
    <rect x="602.3" y="778.6" width="125.3" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <rect x="602.3" y="857.8" width="125.3" height="6" rx="3" fill="#000000" opacity="0.07"/>
  </g>
  <!-- SIDE_KEYPAD_BEGIN (gen_side_keypad.py が生成) -->
  <!-- 左側面キーパッド(ベクトル台形・角丸なし) -->
  <g clip-path="url(#clipLeft)">
    <path d="M 197.8 548.3 L 171.8 534.3 L 171.8 619.5 L 197.8 633.5 Z" fill="#9fcbe8"/>
    <path d="M 166.0 531.3 L 140.0 517.3 L 140.0 602.5 L 166.0 616.5 Z" fill="#f2b894"/>
    <path d="M 134.3 514.3 L 108.3 500.3 L 108.3 585.5 L 134.3 599.5 Z" fill="#9dd6b4"/>
    <path d="M 197.8 653.3 L 171.8 639.3 L 171.8 724.5 L 197.8 738.5 Z" fill="#f4dd8f"/>
    <path d="M 166.0 636.3 L 140.0 622.3 L 140.0 707.5 L 166.0 721.5 Z" fill="#eaa6b0"/>
    <path d="M 134.3 619.3 L 108.3 605.3 L 108.3 690.5 L 134.3 704.5 Z" fill="#b3a6de"/>
    <path d="M 197.8 758.3 L 171.8 744.3 L 171.8 829.5 L 197.8 843.5 Z" fill="#d0a8d4"/>
    <path d="M 166.0 741.3 L 140.0 727.3 L 140.0 812.5 L 166.0 826.5 Z" fill="#8fd4c9"/>
    <path d="M 134.3 724.3 L 108.3 710.3 L 108.3 795.5 L 134.3 809.5 Z" fill="#f0a98f"/>
  </g>
  <!-- 右側面キーパッド(ベクトル台形・角丸なし) -->
  <g clip-path="url(#clipRight)">
    <path d="M 915.7 500.3 L 889.7 514.3 L 889.7 599.5 L 915.7 585.5 Z" fill="#9fcbe8"/>
    <path d="M 915.7 500.3 L 889.7 514.3 L 889.7 599.5 L 915.7 585.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 884.0 517.3 L 858.0 531.3 L 858.0 616.5 L 884.0 602.5 Z" fill="#f2b894"/>
    <path d="M 884.0 517.3 L 858.0 531.3 L 858.0 616.5 L 884.0 602.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 852.2 534.3 L 826.2 548.3 L 826.2 633.5 L 852.2 619.5 Z" fill="#9dd6b4"/>
    <path d="M 852.2 534.3 L 826.2 548.3 L 826.2 633.5 L 852.2 619.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 915.7 605.3 L 889.7 619.3 L 889.7 704.5 L 915.7 690.5 Z" fill="#f4dd8f"/>
    <path d="M 915.7 605.3 L 889.7 619.3 L 889.7 704.5 L 915.7 690.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 884.0 622.3 L 858.0 636.3 L 858.0 721.5 L 884.0 707.5 Z" fill="#eaa6b0"/>
    <path d="M 884.0 622.3 L 858.0 636.3 L 858.0 721.5 L 884.0 707.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 852.2 639.3 L 826.2 653.3 L 826.2 738.5 L 852.2 724.5 Z" fill="#b3a6de"/>
    <path d="M 852.2 639.3 L 826.2 653.3 L 826.2 738.5 L 852.2 724.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 915.7 710.3 L 889.7 724.3 L 889.7 809.5 L 915.7 795.5 Z" fill="#d0a8d4"/>
    <path d="M 915.7 710.3 L 889.7 724.3 L 889.7 809.5 L 915.7 795.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 884.0 727.3 L 858.0 741.3 L 858.0 826.5 L 884.0 812.5 Z" fill="#8fd4c9"/>
    <path d="M 884.0 727.3 L 858.0 741.3 L 858.0 826.5 L 884.0 812.5 Z" fill="#000000" opacity="0.2"/>
    <path d="M 852.2 744.3 L 826.2 758.3 L 826.2 843.5 L 852.2 829.5 Z" fill="#f0a98f"/>
    <path d="M 852.2 744.3 L 826.2 758.3 L 826.2 843.5 L 852.2 829.5 Z" fill="#000000" opacity="0.2"/>
  </g>
  <!-- SIDE_KEYPAD_END -->
  <!-- 天面(口) -->
  <path d="M 478.3 392.5 L 512.0 388.2 L 545.7 392.5 L 925.3 440.5 L 959.0 444.7 L 929.0 460.8 L 818.2 520.1 L 788.3 536.2 L 754.3 536.2 L 269.7 536.2 L 235.7 536.2 L 205.8 520.1 L 95.0 460.8 L 65.0 444.7 L 98.7 440.5 Z" fill="url(#topg)"/>
  <g fill="none" stroke="#a98a63" stroke-width="4" opacity="0.24" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 478.3 392.5 L 512.0 388.2 L 545.7 392.5 L 925.3 440.5 L 959.0 444.7 L 929.0 460.8 L 818.2 520.1 L 788.3 536.2 L 754.3 536.2 L 269.7 536.2 L 235.7 536.2 L 205.8 520.1 L 95.0 460.8 L 65.0 444.7 L 98.7 440.5 Z"/>
  </g>
  <!-- 円柱(ロール): 上端y=110固定・直径拡大。手前に描くが clipRoll(口ライン)で切り、下半分は埋没して見せる。 -->
  <g clip-path="url(#clipRoll)">
    <g filter="url(#dsc)">
      <rect x="235.7" y="110.0" width="552.5" height="786.0" rx="26" fill="url(#cyl)"/>
    </g>
    <rect x="235.7" y="110.0" width="16" height="786.0" rx="26" fill="#000000" opacity="0.06"/>
    <rect x="772.3" y="110.0" width="16" height="786.0" rx="26" fill="#000000" opacity="0.10"/>
    <!-- 計算行(レシート印字風): ロール紙にカラフルな行を数行。左=項目バー / 右=金額バー -->
    <g opacity="0.9">
      <!-- 行1 y=196 -->
      <rect x="300"  y="196" width="150" height="20" rx="10" fill="#9fcbe8"/>
      <rect x="560"  y="196" width="164" height="20" rx="10" fill="#f2b894"/>
